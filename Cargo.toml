[package]
name = "bone-morphometry"
version = "0.7.0-rc.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jhnrckmnznrs/bone_morphometry"
description = "ROI-aware 3-D trabecular bone morphometry with BoneJ-compatible and advanced descriptors"

[features]
default = []
validation-hooks = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rayon = "1.11"
tiff = "0.11.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
